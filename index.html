<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Garden · plant a flower garden on any page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Karla:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --paper: #fdfefd;
    --ink: #22301d;
    --faded: #9aa894;
    --hair: #dfe9d9;
    --track: #e5ede0;
    --green: #7fa46c;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Karla', -apple-system, sans-serif;
  }
  html { height: 100%; }
  body {
    font-family: var(--sans);
    font-weight: 300;
    background: var(--paper);
    color: var(--ink);
    min-height: 100%;
  }
  #page { max-width: 1280px; margin: 0 auto; padding: 52px 32px 70px; }

  /* ── header ── */
  header { margin-bottom: 26px; }
  header h1 { font-family: var(--serif); font-size: 27px; font-weight: 500; letter-spacing: 0.02em; }

  /* ── the plot: full width, the star of the page ── */
  #plot {
    position: relative;
    /* a camera's proportions — the webcam sits behind this frame */
    aspect-ratio: 16 / 9;
    width: min(100%, calc(76vh * 16 / 9));
    margin: 0 auto;
    border: 1.5px solid #35502b;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(#ffffff 0%, #f4f9f0 55%, #e5f0db 100%);
  }
  #plot::after {
    content: '';
    position: absolute; inset: 10px;
    border: 1.5px dashed rgba(53,80,43,0.3);
    border-radius: 12px;
    pointer-events: none;
    z-index: 2;
  }
  #cam {
    position: absolute; inset: -30px;
    width: calc(100% + 60px); height: calc(100% + 60px);
    object-fit: cover;
    transform: scaleX(-1);
    filter: blur(16px) brightness(1.08) saturate(0.8);
    display: none;
  }
  #plot.cam-on #cam { display: block; }
  #cam-veil {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.42);
    display: none; pointer-events: none;
  }
  #plot.cam-on #cam-veil { display: block; }
  /* hand cursor: a green ring that follows, ripples on planting,
     and tightens into a dot while pinching */
  #hand-dot {
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(214,231,199,0.6);
    border: 2.5px solid #7fa46c;
    transform: translate(-50%, -50%);
    z-index: 3;
    pointer-events: none;
    display: none;
    transition: background 0.12s ease, transform 0.12s ease;
  }
  #hand-dot.pinch {
    background: rgba(214,231,199,0.95);   /* squeezed smaller — the fill packs denser */
    transform: translate(-50%, -50%) scale(0.72);
  }
  .plant-ripple {
    position: absolute;
    width: 46px; height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    border: 2px solid #7fa46c;
    pointer-events: none;
    z-index: 3;
    animation: ripple 0.45s ease-out forwards;
  }
  .plant-ripple.big {
    width: 72px; height: 72px;
    margin: -36px 0 0 -36px;
  }
  @keyframes ripple {
    0% { transform: scale(0.3); opacity: 0.55; }
    100% { transform: scale(1); opacity: 0; }
  }
  /* mouth cursor: a quiet pink dot that opens into a ring while eating,
     with a dashed circle showing the eating range */
  #mouth-dot {
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 3px solid rgba(226,112,158,0.96);
    background: rgba(250,210,227,0.68);
    transform: translate(-50%, -50%);
    z-index: 3;
    pointer-events: none;
    display: none;
    transition: width 0.15s ease, height 0.15s ease, background 0.15s ease;
  }
  #mouth-dot.eating {
    width: 26px; height: 26px;
    background: rgba(250,210,227,0.32);   /* stretched open — still soft, but clearer */
    border-width: 3.5px;
  }
  #mouth-range {
    position: absolute;
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 2px dashed rgba(226,112,158,0.62);
    transform: translate(-50%, -50%);
    z-index: 3;
    pointer-events: none;
    display: none;
  }
  @keyframes nom {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.28); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  #mouth-dot.nom { animation: nom 0.16s ease; }
  #garden { position: absolute; inset: 0; z-index: 1; }
  #hint {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #hint span { font-size: 13px; font-style: italic; color: var(--faded); }

  /* ── controls: camera on the left, clear on the right ── */
  #controls {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px;
    width: min(100%, calc(76vh * 16 / 9));   /* line up with the plot */
    margin: 16px auto 0;
  }
  .ctl { display: flex; align-items: center; gap: 10px; }
  .lbl { font-size: 12px; color: var(--faded); letter-spacing: 0.05em; }

  /* iOS toggle switch */
  .switch {
    position: relative;
    width: 42px; height: 25px;
    border-radius: 999px;
    background: var(--track);
    border: none; cursor: pointer; padding: 0;
    transition: background 0.25s ease;
    flex-shrink: 0;
  }
  .switch .knob {
    position: absolute; top: 2.5px; left: 2.5px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(38,35,31,0.26);
    transition: left 0.25s cubic-bezier(0.3, 0.9, 0.4, 1);
  }
  .switch.on { background: var(--green); }
  .switch.on .knob { left: 19.5px; }

  /* iOS-ish button */
  #clear {
    font: inherit; font-size: 12.5px; color: var(--ink);
    background: #fff; border: none; border-radius: 10px;
    padding: 7px 18px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(38,35,31,0.12), 0 0 0 0.5px rgba(38,35,31,0.05);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  #clear:active { transform: scale(0.96); box-shadow: 0 1px 2px rgba(38,35,31,0.16); }

  /* ── flower ID cards ── */
  #catalog {
    width: min(100%, calc(76vh * 16 / 9));   /* line up with the plot */
    margin: 34px auto 0;
  }
  #catalog h2 {
    font-size: 11px; font-weight: 400; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--faded);
    margin-bottom: 12px;
  }
  /* one horizontal strip of cards under the plot */
  #cards { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
  .card {
    position: relative;
    background: #ffffff;
    border: 1px solid var(--hair);
    border-radius: 13px;
    padding: 12px 6px 10px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(38,35,31,0.06); }
  .card .pic { height: 46px; display: flex; align-items: center; justify-content: center; transition: filter 0.2s ease, opacity 0.2s ease; }
  .card .name { margin-top: 6px; font-family: var(--serif); font-size: 13.5px; font-weight: 500; text-transform: capitalize; line-height: 1.25; }
  .card .no { margin-top: 2px; font-size: 9px; letter-spacing: 0.14em; color: var(--faded); }
  .card .tick {
    position: absolute; top: 8px; right: 8px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 1px solid var(--hair);
    background: #fff;
    font-size: 10px; line-height: 15px; color: transparent;
    transition: all 0.15s ease;
  }
  .card.on { border-color: #b5cda4; background: #fbfdf8; }
  .card.on .tick { background: var(--green); border-color: var(--green); color: #fff; }
  .card:not(.on) .pic { filter: grayscale(1); opacity: 0.35; }
  .card:not(.on) .name { color: var(--faded); }

  @media (max-width: 900px) {
    #cards { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    #plot, #controls, #catalog { width: 100%; }
    #plot { aspect-ratio: 4 / 3; }
  }
</style>
</head>
<body>
<div id="page">

  <header>
    <h1>My Tiny Garden</h1>
  </header>

  <div id="plot">
    <video id="cam" autoplay playsinline muted></video>
    <div id="cam-veil"></div>
    <div id="garden"></div>
    <div id="hand-dot"></div>
    <div id="mouth-range"></div>
    <div id="mouth-dot"></div>
    <div id="hint"><span>an empty plot — come plant something</span></div>
  </div>

  <div id="controls">
    <div class="ctl">
      <span class="lbl" id="cam-lbl">camera soil</span>
      <button class="switch" id="cam-switch" role="switch" aria-checked="false" aria-label="camera soil">
        <span class="knob"></span>
      </button>
    </div>
    <button id="clear">clear</button>
  </div>

  <aside id="catalog">
    <h2>Flower ID Cards</h2>
    <div id="cards"></div>
  </aside>

</div>

<script src="garden.js"></script>
<script>
  // ── the garden ──
  var hintEl = document.getElementById('hint');
  var hintHidden = false;

  var garden = Garden.plant('#garden', {
    // A moderate raw range; the depth layout below gives each new flower
    // a natural target height based on how far back it sits in the plot.
    height: [80, 220],
    // We play one controlled sound ourselves for mouse, touch and gestures,
    // so the library sound is disabled to avoid accidental double volume.
    sound: false
  });

  // ── natural garden depth ──
  // SVG paints later elements on top. Each flower is wrapped once and scaled
  // uniformly around its base, then sorted back-to-front by ground position.
  // The trend is deliberately soft: back flowers are generally taller and
  // front flowers more petite, without changing the original flower proportions.
  var naturalLayoutPending = false;

  function stableNoise(a, b) {
    var x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function wrapFlowerForDepth(g) {
    if (!g || g.dataset.naturalDepthStyled === '1') return;
    var parent = g.parentNode;
    if (!parent) return;

    var box;
    try { box = g.getBBox(); } catch (e) { return; }
    if (!box || !isFinite(box.height) || box.height < 1) return;

    var H = plotEl.clientHeight || 1;
    var centreX = box.x + box.width / 2;
    var baseY = box.y + box.height;
    var frontness = Math.max(0, Math.min(1,
      (baseY - H * 0.26) / Math.max(1, H * 0.68)));

    var n1 = stableNoise(centreX, baseY);
    var n2 = stableNoise(baseY + 19.7, centreX + 43.1);

    // Back: about 38–45% of the plot height. Front: about 19–27%.
    // Random variation overlaps the bands slightly, keeping the result organic.
    var targetHeight = H * (0.405 - 0.175 * frontness);
    targetHeight += (n1 - 0.5) * H * 0.075;
    targetHeight = Math.max(70, Math.min(H * 0.47, targetHeight));

    // Use one uniform scale for both axes. This keeps every species' original
    // silhouette and petal/stem proportions intact while still creating depth.
    // The range is intentionally restrained so the garden stays natural.
    var scale = Math.max(0.78, Math.min(1.30, targetHeight / box.height));

    var wrap = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    wrap.setAttribute('data-depth-wrap', '1');
    wrap.dataset.baseY = String(baseY);
    wrap.dataset.scaleX = String(scale);
    wrap.dataset.scaleY = String(scale);
    wrap.setAttribute('transform',
      'translate(' + centreX + ',' + baseY + ')' +
      ' scale(' + scale + ')' +
      ' translate(' + (-centreX) + ',' + (-baseY) + ')');

    parent.insertBefore(wrap, g);
    wrap.appendChild(g);
    g.dataset.naturalDepthStyled = '1';
  }

  function sortFlowerDepth() {
    var groups = Array.prototype.slice.call(
      garden.svg.querySelectorAll('g[data-depth]'));
    for (var i = 0; i < groups.length; i++) wrapFlowerForDepth(groups[i]);

    var parents = [];
    var wraps = garden.svg.querySelectorAll('g[data-depth-wrap]');
    for (var j = 0; j < wraps.length; j++) {
      var p = wraps[j].parentNode;
      if (p && parents.indexOf(p) < 0) parents.push(p);
    }

    parents.forEach(function (parent) {
      var siblings = Array.prototype.slice.call(
        parent.querySelectorAll(':scope > g[data-depth-wrap]'));
      var sorted = siblings.slice().sort(function (a, b) {
        return (+a.dataset.baseY || 0) - (+b.dataset.baseY || 0);
      });
      for (var k = 0; k < sorted.length; k++) {
        if (siblings[k] !== sorted[k]) {
          for (var m = 0; m < sorted.length; m++) parent.appendChild(sorted[m]);
          break;
        }
      }
    });
  }

  function cleanupDepthWraps() {
    var wraps = garden.svg.querySelectorAll('g[data-depth-wrap]');
    for (var i = wraps.length - 1; i >= 0; i--) {
      if (!wraps[i].querySelector('g[data-depth]')) wraps[i].remove();
    }
  }

  function scheduleNaturalGardenLayout() {
    if (naturalLayoutPending) return;
    naturalLayoutPending = true;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        naturalLayoutPending = false;
        cleanupDepthWraps();
        sortFlowerDepth();
      });
    });
  }

  var flowerObserver = new MutationObserver(function (mutations) {
    var relevant = false;
    for (var i = 0; i < mutations.length && !relevant; i++) {
      var added = mutations[i].addedNodes;
      var removed = mutations[i].removedNodes;
      if (removed && removed.length) relevant = true;
      for (var j = 0; j < added.length; j++) {
        var node = added[j];
        if (node.nodeType !== 1) continue;
        if ((node.matches && node.matches('g[data-depth]')) ||
            (node.querySelector && node.querySelector('g[data-depth]'))) {
          relevant = true;
          break;
        }
      }
    }
    if (relevant) scheduleNaturalGardenLayout();
  });
  flowerObserver.observe(garden.svg, { childList: true, subtree: true });

  // ── flower ID cards ──
  var NAMES = { forgetmenot: 'forget-me-not' };
  var selected = {};
  var cardsEl = document.getElementById('cards');
  Garden.SPECIES.forEach(function (species, i) {
    selected[species] = true;
    var card = document.createElement('div');
    card.className = 'card on';
    var pic = document.createElement('div');
    pic.className = 'pic';
    pic.appendChild(Garden.preview(species, 48));
    card.appendChild(pic);
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = NAMES[species] || species;
    card.appendChild(name);
    var no = document.createElement('div');
    no.className = 'no';
    no.textContent = 'Nº ' + String(i + 1).padStart(2, '0');
    card.appendChild(no);
    var tick = document.createElement('div');
    tick.className = 'tick';
    tick.textContent = '✓';
    card.appendChild(tick);
    card.addEventListener('click', function () {
      selected[species] = !selected[species];
      card.classList.toggle('on', selected[species]);
      garden.setFlowers(Garden.SPECIES.filter(function (s) { return selected[s]; }));
    });
    cardsEl.appendChild(card);
  });

  // ── clear ──
  document.getElementById('clear').addEventListener('click', function () {
    garden.clear();
    setTimeout(cleanupDepthWraps, 0);
  });

  // ── camera soil: iOS-style switch ──
  var camSwitch = document.getElementById('cam-switch');
  var camLbl = document.getElementById('cam-lbl');
  var camEl = document.getElementById('cam');
  var plotEl = document.getElementById('plot');
  var camStream = null;

  // ── reliable planting sound ──
  // Garden's built-in sound may only fire for its own pointer handlers.
  // Gesture planting calls garden.spray() directly, so we play a small sound here.
  var plantAudioCtx = null;
  var lastPlantSoundAt = 0;

  // Planting and eating share the same controlled peak level. Perceived loudness
  // remains gentle, and one mouth gesture still plays only one bite sound.
  var PLANT_SOUND_VOLUME = 0.16;
  var EAT_SOUND_VOLUME = 0.16;
  var eatSoundBuffer = null;

  function unlockPlantAudio() {
    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    if (!plantAudioCtx) plantAudioCtx = new AudioContextClass();
    if (plantAudioCtx.state === 'suspended') plantAudioCtx.resume();
    prepareEatSound(plantAudioCtx);
    return plantAudioCtx;
  }

  function playEatSound() {
    var ctx = unlockPlantAudio();
    if (!ctx) return;
    if (ctx.state !== 'running') {
      ctx.resume().then(playEatSound);
      return;
    }
    if (!eatSoundBuffer) {
      prepareEatSound(ctx).then(function (buffer) {
        if (buffer) playEatSound();
      });
      return;
    }

    var source = ctx.createBufferSource();
    var gain = ctx.createGain();
    source.buffer = eatSoundBuffer;
    gain.gain.setValueAtTime(EAT_SOUND_VOLUME, ctx.currentTime);
    source.connect(gain).connect(ctx.destination);
    source.start(ctx.currentTime);
  }

  function playPlantSound(strength) {
    var ctx = unlockPlantAudio();
    if (!ctx) return;
    if (ctx.state !== 'running') {
      ctx.resume().then(function () { playPlantSound(strength); });
      return;
    }

    // Prevent a fast hand sweep from producing an unpleasant wall of sound.
    var ms = performance.now();
    if (ms - lastPlantSoundAt < 65) return;
    lastPlantSoundAt = ms;

    strength = strength == null ? 0.75 : strength;
    var now = ctx.currentTime;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(PLANT_SOUND_VOLUME * strength, now + 0.008);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 0.20);
    master.connect(ctx.destination);

    // Soft earthy "pop".
    var pop = ctx.createOscillator();
    var popGain = ctx.createGain();
    pop.type = 'sine';
    pop.frequency.setValueAtTime(260, now);
    pop.frequency.exponentialRampToValueAtTime(135, now + 0.15);
    popGain.gain.setValueAtTime(0.75, now);
    popGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
    pop.connect(popGain).connect(master);
    pop.start(now);
    pop.stop(now + 0.17);

    // Tiny bright petal sparkle.
    var sparkle = ctx.createOscillator();
    var sparkleGain = ctx.createGain();
    sparkle.type = 'triangle';
    sparkle.frequency.setValueAtTime(760, now + 0.025);
    sparkle.frequency.exponentialRampToValueAtTime(1180, now + 0.13);
    sparkleGain.gain.setValueAtTime(0.0001, now);
    sparkleGain.gain.exponentialRampToValueAtTime(0.22, now + 0.035);
    sparkleGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    sparkle.connect(sparkleGain).connect(master);
    sparkle.start(now + 0.02);
    sparkle.stop(now + 0.19);
  }

  // Browsers do not allow audio before a real user gesture. The camera switch,
  // a click/tap, or a key press unlocks the AudioContext for later hand gestures.
  ['pointerdown', 'touchstart', 'keydown'].forEach(function (eventName) {
    document.addEventListener(eventName, unlockPlantAudio, { passive: true });
  });

  // Mouse/touch planting handled internally by Garden also gets the fallback sound.
  plotEl.addEventListener('pointerdown', function () {
    playPlantSound(0.92);
  }, true);

  function camOff() {
    if (camStream) {
      camStream.getTracks().forEach(function (t) { t.stop(); });
      camStream = null;
    }
    camEl.srcObject = null;
    plotEl.classList.remove('cam-on');
    camSwitch.classList.remove('on');
    camSwitch.setAttribute('aria-checked', 'false');
    stopHands();
    camLbl.textContent = 'camera soil';
  }

  camSwitch.addEventListener('click', function () {
    if (camStream) { camOff(); return; }
    // optimistic flip, roll back if permission is denied
    camSwitch.classList.add('on');
    camSwitch.setAttribute('aria-checked', 'true');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
      .then(function (stream) {
        camStream = stream;
        camEl.srcObject = stream;
        plotEl.classList.add('cam-on');
        startHands();
      })
      .catch(function () {
        camOff();
        camLbl.textContent = 'camera unavailable';
        setTimeout(function () { camLbl.textContent = 'camera soil'; }, 2200);
      });
  });

  // ── gesture gardening: hands grow flowers, the mouth eats them ──
  // Hand + face tracking run locally in the browser (MediaPipe); nothing is uploaded.
  var MP_VERSION = '0.10.14';
  var handLandmarker = null;
  var faceLandmarker = null;
  var handLoopId = null;
  var handDot = document.getElementById('hand-dot');
  var mouthDot = document.getElementById('mouth-dot');
  var mouthRange = document.getElementById('mouth-range');
  var pinchWas = false;
  var lastHandX = -999, lastHandY = -999, lastHandT = 0;
  var mouthWasClosed = true, eatCooldown = 0;

  // ── mouth sensitivity ──
  // Two signals decide "open": MediaPipe's jawOpen score, and the real lip gap
  // measured against mouth width (that ratio behaves the same near or far from
  // the camera). Either one is enough, so a small opening still counts.
  // OPEN and CLOSE differ on purpose — the gap stops it flickering on the edge.
  // Lower OPEN values = easier to trigger.
  var MOUTH_OPEN_JAW = 0.20;
  var MOUTH_CLOSE_JAW = 0.09;
  var MOUTH_OPEN_RATIO = 0.040;   // lip gap ÷ mouth width
  var MOUTH_CLOSE_RATIO = 0.024;

  function startHands() {
    if (handLandmarker && faceLandmarker) { handLoop(); return; }
    camLbl.textContent = 'loading gestures…';
    import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VERSION)
      .then(function (mp) {
        return mp.FilesetResolver
          .forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VERSION + '/wasm')
          .then(function (files) {
            return Promise.all([
              mp.HandLandmarker.createFromOptions(files, {
                baseOptions: {
                  modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
                },
                runningMode: 'VIDEO',
                numHands: 1
              }),
              mp.FaceLandmarker.createFromOptions(files, {
                baseOptions: {
                  modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
                },
                runningMode: 'VIDEO',
                numFaces: 1,
                outputFaceBlendshapes: true
              })
            ]);
          });
      })
      .then(function (models) {
        handLandmarker = models[0];
        faceLandmarker = models[1];
        if (camStream) {
          camLbl.textContent = 'wave to plant · open wide to eat';
          handLoop();
        }
      })
      .catch(function () {
        if (camStream) camLbl.textContent = 'camera soil (gestures unavailable)';
      });
  }

  function stopHands() {
    if (handLoopId) { cancelAnimationFrame(handLoopId); handLoopId = null; }
    handDot.style.display = 'none';
    mouthDot.style.display = 'none';
    mouthRange.style.display = 'none';
    pinchWas = false;
    mouthWasClosed = true;
  }

  // the video is mirrored and object-fit: cover with a 30px bleed —
  // map a normalized landmark to plot coordinates through that transform
  function handToPlot(lm) {
    var bw = plotEl.clientWidth + 60, bh = plotEl.clientHeight + 60;
    var vw = camEl.videoWidth || 640, vh = camEl.videoHeight || 480;
    var s = Math.max(bw / vw, bh / vh);
    var dw = vw * s, dh = vh * s;
    var px = lm.x * dw - (dw - bw) / 2;
    var py = lm.y * dh - (dh - bh) / 2;
    return { x: (bw - px) - 30, y: py - 30 };
  }

  function handLoop() {
    handLoopId = requestAnimationFrame(handLoop);
    if (!camStream || camEl.readyState < 2) return;
    processHands();
    processFace();
  }

  function processHands() {
    if (!handLandmarker) return;
    var res;
    try { res = handLandmarker.detectForVideo(camEl, performance.now()); }
    catch (e) { return; }
    if (!res.landmarks || !res.landmarks.length) {
      handDot.style.display = 'none';
      pinchWas = false;
      return;
    }
    var lm = res.landmarks[0];
    var tip = lm[8], thumb = lm[4], wrist = lm[0], midBase = lm[9];
    var p = handToPlot(tip);

    handDot.style.display = 'block';
    handDot.style.left = p.x + 'px';
    handDot.style.top = p.y + 'px';

    // pinch = thumb tip close to index tip, relative to hand size
    var handSize = Math.hypot(midBase.x - wrist.x, midBase.y - wrist.y) || 0.001;
    var pinch = Math.hypot(tip.x - thumb.x, tip.y - thumb.y) < handSize * 0.4;
    handDot.classList.toggle('pinch', pinch);

    if (p.x < 0 || p.y < 0 || p.x > plotEl.clientWidth || p.y > plotEl.clientHeight) {
      pinchWas = pinch;
      return;
    }
    var rect = plotEl.getBoundingClientRect();
    var clientX = rect.left + p.x, clientY = rect.top + p.y;

    if (pinch && !pinchWas) {
      garden.spray(clientX, clientY, 6);       // pinch = a bouquet, like a click
      playPlantSound(1.0);
      scheduleNaturalGardenLayout();
      plantRipple(p.x, p.y, true);
    } else if (!pinch) {
      var now = performance.now();
      var dist = Math.hypot(p.x - lastHandX, p.y - lastHandY);
      if (dist > 12 && now - lastHandT > 130) { // wave = sprinkle, like mousemove
        lastHandX = p.x; lastHandY = p.y; lastHandT = now;
        garden.spray(clientX, clientY, 2);
        playPlantSound(0.82);
        scheduleNaturalGardenLayout();
        plantRipple(p.x, p.y, false);
      }
    }
    pinchWas = pinch;
    if (!hintHidden) { hintHidden = true; hintEl.style.opacity = '0'; }
  }

  // a quick green ripple wherever the hand just planted
  function plantRipple(x, y, big) {
    var r = document.createElement('div');
    r.className = 'plant-ripple' + (big ? ' big' : '');
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    plotEl.appendChild(r);
    setTimeout(function () { r.remove(); }, 500);
  }

  // ── the mouth: open wide and the nearest flower gets eaten ──
  function processFace() {
    if (!faceLandmarker) return;
    var res;
    try { res = faceLandmarker.detectForVideo(camEl, performance.now()); }
    catch (e) { return; }
    if (!res.faceLandmarks || !res.faceLandmarks.length) {
      mouthDot.style.display = 'none';
      mouthRange.style.display = 'none';
      mouthWasClosed = true;
      return;
    }
    var cats = (res.faceBlendshapes && res.faceBlendshapes[0])
      ? res.faceBlendshapes[0].categories : [];
    var jaw = 0;
    for (var i = 0; i < cats.length; i++) {
      if (cats[i].categoryName === 'jawOpen') { jaw = cats[i].score; break; }
    }
    // how far the lips actually parted, relative to mouth width
    var face = res.faceLandmarks[0];
    var upperLip = face[13], lowerLip = face[14];
    var lipGap = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y);
    var mouthWidth = Math.hypot(face[61].x - face[291].x, face[61].y - face[291].y) || 0.001;
    var mouthRatio = lipGap / mouthWidth;
    var mouthOpen = jaw >= MOUTH_OPEN_JAW || mouthRatio >= MOUTH_OPEN_RATIO;
    var mouthShut = jaw <= MOUTH_CLOSE_JAW && mouthRatio <= MOUTH_CLOSE_RATIO;

    var mouth = handToPlot(upperLip);   // upper inner lip
    var visible = mouth.x > 0 && mouth.y > 0 &&
      mouth.x < plotEl.clientWidth && mouth.y < plotEl.clientHeight;
    mouthDot.style.display = visible ? 'block' : 'none';
    mouthDot.style.left = mouth.x + 'px';
    mouthDot.style.top = mouth.y + 'px';
    mouthDot.classList.toggle('eating', mouthOpen);
    // the dashed range circle appears only while the mouth is open
    var ranging = visible && mouthOpen;
    mouthRange.style.display = ranging ? 'block' : 'none';
    if (ranging) {
      mouthRange.style.left = mouth.x + 'px';
      mouthRange.style.top = mouth.y + 'px';
    }

    // one open-and-close is one bite: 1–2 flowers, then you have to
    // close your mouth before the next one counts
    var now = performance.now();
    if (mouthOpen && mouthWasClosed && now > eatCooldown) {
      mouthWasClosed = false;
      eatCooldown = now + 300;
      var mouthful = 1 + Math.floor(Math.random() * 2);
      var eatenCount = 0;
      for (var b = 0; b < mouthful; b++) {
        if (!eatNearest(mouth.x, mouth.y)) break;
        eatenCount++;
      }
      // Play once per bite, not once per flower, to keep the volume controlled.
      if (eatenCount > 0) playEatSound();
    }
    if (mouthShut) mouthWasClosed = true;
  }

  // ── eating: petals fly into the mouth, the flower's centre stays behind ──
  function flowerHead(g) {
    var gs = g.querySelectorAll(':scope > g');
    return gs.length ? gs[gs.length - 1] : null;
  }

  function eatNearest(mx, my) {
    var best = null, bestD = Infinity;
    var groups = garden.svg.querySelectorAll('g[data-depth]');
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      if (g.dataset.eaten) continue;
      var fg = flowerHead(g);
      if (!fg) continue;
      var m = /translate\(([-\d.e]+)[ ,]+([-\d.e]+)\)/.exec(fg.getAttribute('transform') || '');
      if (!m) continue;

      var localHx = +m[1], localHy = +m[2];
      var actual = { x: localHx, y: localHy };
      try {
        var matrix = fg.getCTM();
        if (matrix) {
          var point = new DOMPoint(0, 0).matrixTransform(matrix);
          actual = { x: point.x, y: point.y };
        }
      } catch (e) {}

      var depthWrap = g.closest ? g.closest('g[data-depth-wrap]') : g.parentNode;
      var visualScaleX = depthWrap && depthWrap.dataset.scaleX
        ? +depthWrap.dataset.scaleX : 1;
      var visualScaleY = depthWrap && depthWrap.dataset.scaleY
        ? +depthWrap.dataset.scaleY : 1;
      var d = Math.hypot(actual.x - mx, actual.y - my);
      if (d < bestD) {
        bestD = d;
        best = {
          g: g, fg: fg,
          hx: actual.x, hy: actual.y,
          localHx: localHx, localHy: localHy,
          visualScaleX: visualScaleX, visualScaleY: visualScaleY
        };
      }
    }
    // only flowers within reach of the mouth get eaten
    // (keep in sync with #mouth-range: circle radius = 80px)
    if (!best || bestD > 80) return false;
    best.g.dataset.eaten = '1';
    eatPetals(best, mx, my);
    return true;
  }

  // suction: one sharp inhale, then EVERY petal is pulled in at once —
  // stretched long and thin along converging streams into the mouth.
  // What's left folds into the green calyx.
  function eatPetals(f, mx, my) {
    var petals = Array.prototype.slice.call(
      f.fg.querySelectorAll(':scope > ellipse, :scope > path'));
    if (!petals.length) { budTransform(f); stemRecoil(f.g); return; }

    for (var i = 0; i < petals.length; i++) {
      flyPetal(petals[i], f, mx, my, Math.random() * 70);
    }
    nomMouth();
    // the calyx opens while the last petals are still on their way,
    // so the stalk is never left bare
    setTimeout(function () {
      budTransform(f);
      stemRecoil(f.g);
    }, 240);
  }

  // one petal in the stream: brief inhale, then sucked in — elongating
  // along the direction of flow as it accelerates
  function flyPetal(petal, f, mx, my, delay) {
    var wrap = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    wrap.setAttribute('transform',
      'translate(' + f.hx + ',' + f.hy + ')' +
      ' scale(' + f.visualScaleX + ',' + f.visualScaleY + ')');
    garden.svg.appendChild(wrap);
    wrap.appendChild(petal);

    var dx = mx - f.hx, dy = my - f.hy;
    var dist = Math.hypot(dx, dy) || 1;
    var ux = dx / dist, uy = dy / dist;
    var pxn = -uy, pyn = ux;
    var bend = (Math.random() - 0.5) * 60;          // each petal rides its own stream
    var flowAngle = Math.atan2(dy, dx) * 180 / Math.PI;
    var INHALE = 70, SUCK = 280;
    var t0 = null;

    (function anim(ts) {
      if (!t0) t0 = ts;
      var t = ts - t0 - delay;
      if (t < 0) { requestAnimationFrame(anim); return; }
      if (t < INHALE) {
        var q = t / INHALE;
        wrap.setAttribute('transform',
          'translate(' + (f.hx + ux * 8 * q) + ',' + (f.hy + uy * 8 * q) +
          ') scale(' + ((1 + 0.1 * q) * f.visualScaleX) + ',' +
          ((1 + 0.1 * q) * f.visualScaleY) + ')');
        requestAnimationFrame(anim);
        return;
      }
      var p = Math.min(1, (t - INHALE) / SUCK);
      var e = Math.pow(p, 2.2);                     // slow grip, violent finish
      var x = f.hx + dx * e + pxn * bend * Math.sin(Math.PI * p) * (1 - p);
      var y = f.hy + dy * e + pyn * bend * Math.sin(Math.PI * p) * (1 - p);
      var shrink = Math.max(0.06, 1 - e);
      var along = shrink * (1 + 0.45 * e);          // a gentle pull, not taffy
      var across = shrink * 0.88;
      wrap.setAttribute('transform',
        'translate(' + x + ',' + y + ') rotate(' + flowAngle + ')' +
        ' scale(' + (along * f.visualScaleX) + ',' +
        (across * f.visualScaleY) + ') rotate(' + (-flowAngle) + ')');
      if (p < 1) { requestAnimationFrame(anim); return; }
      wrap.remove();
    })(performance.now());
  }

  // once the petals are gone, the head folds away and the green calyx
  // that held the flower opens up on the bare stem
  function budTransform(f) {
    var t0 = null, DUR = 100;
    (function shrink(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / DUR);
      f.fg.setAttribute('transform',
        'translate(' + f.localHx + ',' + f.localHy + ') scale(' + (1 - p) + ')');
      if (p < 1) { requestAnimationFrame(shrink); return; }
      while (f.fg.firstChild) f.fg.removeChild(f.fg.firstChild);
      growBud(f);
    })(performance.now());
  }

  var NSVG = 'http://www.w3.org/2000/svg';
  function budEl(tag, attrs) {
    var e = document.createElementNS(NSVG, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  // pointed lens shape (like the garden's leaves) — for sepals
  function sepalPath(w, h) {
    return 'M0,0 C' + w + ',' + (-h * 0.12) + ' ' + w + ',' + (-h * 0.88) + ' 0,' + (-h) +
           ' C' + (-w) + ',' + (-h * 0.88) + ' ' + (-w) + ',' + (-h * 0.12) + ' 0,0 Z';
  }

  // a small whorl of pointed sepals splayed open, with a bare receptacle mound
  function calyx(fg, s) {
    var g = budEl('g', { transform: 'scale(' + (s || 1.35) + ')' });
    var angles = [-95, -58, -27, 27, 58, 95];
    var fills = ['#5f8a45', '#76a45a', '#69934f', '#69934f', '#76a45a', '#5f8a45'];
    var sizes = [[2.1, 7.5], [2.2, 8], [2.2, 8.4], [2.2, 8.4], [2.2, 8], [2.1, 7.5]];
    for (var i = 0; i < angles.length; i++) {
      g.appendChild(budEl('path', {
        d: sepalPath(sizes[i][0], sizes[i][1]),
        fill: fills[i],
        transform: 'rotate(' + angles[i] + ')'
      }));
    }
    g.appendChild(budEl('ellipse', { cx: 0, cy: -2.2, rx: 2.4, ry: 1.9, fill: '#7fae5e' }));
    g.appendChild(budEl('ellipse', { cx: -0.6, cy: -2.7, rx: 0.9, ry: 0.7, fill: '#96c274', opacity: '0.9' }));
    fg.appendChild(g);
  }

  function growBud(f) {
    // taller flowers keep a slightly larger calyx
    var H = plotEl.clientHeight || 1;
    var tallness = Math.max(0, Math.min(1, 1 - f.hy / H));
    calyx(f.fg, 1.15 + 0.35 * tallness);
    var t0 = null, DUR = 440;
    (function pop(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / DUR);
      // underdamped spring: overshoots, then settles at 1
      var s = 1 - Math.exp(-5 * p) * Math.cos(p * Math.PI * 2.2);
      f.fg.setAttribute('transform',
        'translate(' + f.localHx + ',' + f.localHy + ') scale(' + Math.max(0, s) + ')');
      if (p < 1) { requestAnimationFrame(pop); return; }
      f.fg.setAttribute('transform', 'translate(' + f.localHx + ',' + f.localHy + ') scale(1)');
    })(performance.now());
  }

  // the stem nods gently once the last petal is gone, then sways again
  function stemRecoil(g) {
    var oldAnim = g.style.animation;
    g.style.animation = 'none';
    var DUR = 520, t0 = null;
    (function wob(ts) {
      if (!t0) t0 = ts;
      var t = (ts - t0) / DUR;
      if (t >= 1) {
        g.style.transform = '';
        g.style.animation = oldAnim;
        return;
      }
      var ang = 7 * Math.exp(-3 * t) * Math.sin(t * Math.PI * 4);
      g.style.transform = 'rotate(' + ang + 'deg)';
      requestAnimationFrame(wob);
    })(performance.now());
  }

  // a tiny "nom" pulse for every bite
  function nomMouth() {
    mouthDot.classList.remove('nom');
    void mouthDot.offsetWidth;                       // restart the animation
    mouthDot.classList.add('nom');
  }

  // ── hint fades once the visitor reaches the plot ──
  function hideHint() {
    if (!hintHidden) { hintHidden = true; hintEl.style.opacity = '0'; }
  }
  plotEl.addEventListener('mouseenter', hideHint);
  plotEl.addEventListener('touchstart', hideHint, { passive: true });

  // seed one flower so the plot reads as alive
  setTimeout(function () {
    var g = document.getElementById('garden');
    garden.plantAt(g.clientWidth * (0.35 + Math.random() * 0.3),
                   g.clientHeight * (0.62 + Math.random() * 0.15));
    scheduleNaturalGardenLayout();
  }, 600);
</script>
</body>
</html>
